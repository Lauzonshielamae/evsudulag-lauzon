<div class="form-container">
    <div class="form">
        <h3>Login To Your Account</h3>
        <p class="err" *ngIf="userError">{{userError}}</p>
        <form [formGroup]="Form" (ngSubmit)="onSubmit()">
            <mat-form-field>
                <mat-label>Username</mat-label>
                <input type="email" matInput formControlName="username" placeholder="Ex. pat@example.com">

                  <mat-error *ngIf="username?.hasError('email')">Please enter a valid email address</mat-error>

                  <mat-error *ngIf="username?.hasError('required')">Username is <strong>required</strong></mat-error>
                
              </mat-form-field>
            <mat-form-field>
                <mat-label>Password</mat-label>
                <input type="password" matInput formControlName="password">

                  <mat-error *ngIf="password?.hasError('required')">Password is <strong>required</strong></mat-error>
                
              </mat-form-field>
            <button type="submit" mat-stroked-button>Login</button>
        </form>
        <p>Don't have an account? <a href="
            #">Register</a></p>
    </div>
</div>
